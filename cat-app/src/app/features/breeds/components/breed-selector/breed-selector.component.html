<div class="container mt-3">
  <h2>Select a Cat Breed</h2>

  <select
    id="breedSelect"
    class="form-control"
    [(ngModel)]="selectedBreedId"
    (change)="onSelect()"
  >
    <option *ngFor="let breed of breeds" [value]="breed.id">{{ breed.name }}</option>
  </select>

  <app-breed-detail [breedId]="selectedBreedId"></app-breed-detail>
</div>
