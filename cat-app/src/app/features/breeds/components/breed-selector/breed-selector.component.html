<mat-card>
  <mat-card-title>Selecciona una Raza</mat-card-title>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Raza</mat-label>
    <mat-select [(value)]="selectedBreed" (selectionChange)="onBreedSelected()">
      <mat-option *ngFor="let breed of breeds" [value]="breed.id">
        {{ breed.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-card>
