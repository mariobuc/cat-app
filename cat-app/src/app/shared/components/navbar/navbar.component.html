<mat-toolbar color="primary">
  <span>Cat App</span>
  <span class="spacer"></span>
  <button mat-button routerLink="/">Inicio</button>
  <button mat-button *ngIf="!isLoggedIn()" routerLink="/login">Iniciar sesión</button>
  <button mat-button *ngIf="!isLoggedIn()" routerLink="/register">Registrarse</button>
  <button mat-button *ngIf="isLoggedIn()" (click)="logout()">Cerrar sesión</button>
</mat-toolbar>
